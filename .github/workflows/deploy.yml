name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ==========================================================================
  # 1. Automated Testing & Verification
  # ==========================================================================
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: provenance
          POSTGRES_PASSWORD: provenance123
          POSTGRES_DB: provenance_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://provenance:provenance123@localhost:5432/provenance_test_db
          TEST_DATABASE_URL: postgresql://provenance:provenance123@localhost:5432/provenance_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-provenance-2026
        run: |
          cd backend
          python -m pytest -v

  # ==========================================================================
  # 2. Multi-Arch Container Build & Remote Deployment
  # ==========================================================================
  deploy:
    name: Build & Deploy to OCI Ampere A1
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "linux/amd64,linux/arm64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build (ARM64 & AMD64)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Deploy to OCI VM via SSH
        if: env.OCI_HOST != ''
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_DEPLOY_DIR: ${{ secrets.OCI_DEPLOY_DIR || '~/provenance-platform' }}
        run: |
          echo "Connecting to OCI VM at ${OCI_HOST}..."
          mkdir -p ~/.ssh
          echo "${OCI_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${OCI_HOST}" >> ~/.ssh/known_hosts

          # Sync repo files & execute deploy.sh on the remote host
          rsync -avz --exclude '.git' --exclude 'backend/venv' --exclude 'frontend/node_modules' ./ "${OCI_USERNAME}@${OCI_HOST}:${OCI_DEPLOY_DIR}/"
          ssh "${OCI_USERNAME}@${OCI_HOST}" "cd ${OCI_DEPLOY_DIR} && chmod +x deploy.sh backup.sh restore.sh && ./deploy.sh"
