version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: provenance_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provenance_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-provenance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-provenance} -d ${POSTGRES_DB:-provenance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          cpus: '0.15'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: provenance_redis_prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: provenance_backend_prod
    restart: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-provenance}:${POSTGRES_PASSWORD:-provenance_secure_pass}@postgres:5432/${POSTGRES_DB:-provenance_db}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: uploads
      TEMP_DIR: uploads/temp
      PROCESSED_DIR: uploads/processed
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 4096M
        reservations:
          cpus: '0.40'
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: provenance_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 1024M
        reservations:
          cpus: '0.05'
          memory: 256M

volumes:
  postgres_data:
    name: provenance_postgres_prod_data
  redis_data:
    name: provenance_redis_prod_data
  uploads_data:
    name: provenance_uploads_prod_data
